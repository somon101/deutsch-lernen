<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Deutsch Lernen</title>
    <script>
      // GitHub Pages has no server-side routing, so a direct link or refresh
      // on an app route (e.g. /lesson/lesson1/practice) 404s here. Encode the
      // intended path into a query string and redirect back to index.html,
      // which restores it via history.replaceState (see index.html).
      var segmentCount = 1; // "/deutsch-lernen/" is one path segment
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
