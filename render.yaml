# LEGACY. Production is moving off Render: Postgres + Storage on Supabase,
# FastAPI on Google Cloud Run (see backend/Dockerfile and
# .github/workflows/deploy-api.yml). Do not create new Render services from
# this file; kept only so the current free-tier app can be torn down after
# the cutover.
#
# Render Blueprint: provisions the FastAPI backend and its PostgreSQL
# database for the Flutter (Android/Windows) app.
# Deploy via Render -> New -> Blueprint -> pick this repository.
#
# The old React+Express service/database (deutsch-lernen-api,
# deutsch-lernen-db) were retired from this blueprint and deleted on Render
# to free up the account's one-free-database slot — the React+Express and
# Capacitor source code itself is untouched in this repo (server/, src/),
# just no longer deployed.
#
# Currently on Render's free tier, which has three limits to be aware of:
#   - the database is removed after 30 days
#   - the service sleeps after ~15 min idle (first request then takes ~30-50s)
#   - no persistent disk, so uploaded avatars/course media are lost on redeploy
# Before real students start using this, switch `plan: free` to
# `plan: starter` (service) / `plan: basic-256mb` (database) and add a disk:
#   disk:
#     name: uploads
#     mountPath: /opt/render/project/src/server/uploads
#     sizeGB: 1
# Note that a free database cannot be upgraded in place — move to a paid one
# while it is still empty to avoid migrating live student progress.
databases:
  - name: deutsch-lernen-fastapi-db
    databaseName: deutsch_lernen_fastapi
    plan: free

services:
  # Flutter-facing backend (Python/FastAPI) — the Windows/Android app built
  # during the migration talks to this. Same DB schema/rows as the local
  # dev database used throughout the migration (restored via pg_dump), not
  # a fresh start.
  - type: web
    name: deutsch-lernen-fastapi
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deutsch-lernen-fastapi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://somon101.github.io
      - key: PYTHON_VERSION
        value: 3.12.7
