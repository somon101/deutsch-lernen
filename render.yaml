# Render Blueprint: provisions the API server and its PostgreSQL database.
# Deploy via Render -> New -> Blueprint -> pick this repository.
#
# Currently on Render's free tier, which has three limits to be aware of:
#   - the database is removed after 30 days
#   - the service sleeps after ~15 min idle (first request then takes ~30-50s)
#   - no persistent disk, so uploaded profile photos are lost on redeploy
# Before real students start using this, switch `plan: free` to
# `plan: starter` (service) / `plan: basic-256mb` (database) and add a disk:
#   disk:
#     name: uploads
#     mountPath: /opt/render/project/src/server/uploads
#     sizeGB: 1
# Note that a free database cannot be upgraded in place — move to a paid one
# while it is still empty to avoid migrating live student progress.
databases:
  - name: deutsch-lernen-db
    databaseName: deutsch_lernen
    plan: free
  # Separate database for the new Flutter/FastAPI stack below — kept apart
  # from the React/Express service's own DB so neither deploy can disturb
  # the other's data. Its actual content is a pg_dump/restore of the local
  # dev database used throughout the Flutter migration (same schema, same
  # rows — admin account, imported legacy lessons, etc.), not a fresh start.
  - name: deutsch-lernen-fastapi-db
    databaseName: deutsch_lernen_fastapi
    plan: free

services:
  - type: web
    name: deutsch-lernen-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    # migrate deploy applies any pending migrations before the server starts
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deutsch-lernen-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://somon101.github.io
      # First admin account, created on first boot if it doesn't exist yet.
      # Set ADMIN_PASSWORD in the Render dashboard when deploying.
      - key: ADMIN_FIRST_NAME
        value: Somon
      - key: ADMIN_LAST_NAME
        value: Admin
      - key: ADMIN_EMAIL
        value: somon.nosirzoda27@gmail.com
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

  # New Flutter-facing backend (Python/FastAPI) — the Windows/Android app
  # built during the migration talks to this, not the Node service above.
  # Same free-tier caveats apply: sleeps after ~15 min idle (first request
  # then takes ~30-50s to wake), no persistent disk (uploaded avatars/media
  # are lost on redeploy — same limitation the old service already has).
  - type: web
    name: deutsch-lernen-fastapi
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deutsch-lernen-fastapi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://somon101.github.io
      - key: PYTHON_VERSION
        value: 3.12.7
