# Sized for a 6 GB machine, not for a build server. The previous 3584m heap
# plus 1536m metaspace asked for more than the OS had left after Windows and
# the Gradle/Kotlin daemons, and the JVM died mid-build with "Native memory
# allocation (malloc) failed" (see the hs_err_pid*.log files this produced).
# Raise these again on a machine with more RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# The Kotlin compiler forks its own JVM; left unbounded it claims a default
# share of total RAM on top of the figure above.
kotlin.daemon.jvmargs=-Xmx1024m
# Serial execution keeps one task's peak from landing on top of another's.
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
