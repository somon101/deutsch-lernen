name: Deploy to GitHub Pages

# Publishes the Flutter app (frontend/) as a website, so teachers can open
# the course builder in a browser with nothing to install. Replaces the old
# React site that used to be deployed here.

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      # --base-href follows the repository name, so the site keeps working
      # if the repository is renamed. --no-web-resources-cdn bundles the
      # rendering engine into the site instead of loading it from gstatic.
      - run: >-
          flutter build web --release
          --no-web-resources-cdn
          --no-wasm-dry-run
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=API_URL=${{ vars.FLUTTER_API_URL || 'https://deutsch-lernen-api-n3ss7qmkpa-an.a.run.app' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
