name: Deploy API to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/898697836405/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deploy@project-c4487d83-9a0e-446d-89e.iam.gserviceaccount.com

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: deutsch-lernen-api
          region: asia-northeast1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: ./backend
          env_vars: |
            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_STORAGE_BUCKET=${{ secrets.SUPABASE_STORAGE_BUCKET }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            FIREBASE_SERVICE_ACCOUNT_JSON_B64=${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
          secrets: |
            DATABASE_URL=DATABASE_URL:latest
            JWT_SECRET=JWT_SECRET:latest
            SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest
          flags: --allow-unauthenticated --min-instances=0 --service-account=github-deploy@project-c4487d83-9a0e-446d-89e.iam.gserviceaccount.com

      - run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
